name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Client bundle has no service_role references
        run: |
          if grep -rIl "SUPABASE_SERVICE_ROLE_KEY" .next/static; then
            echo "::error::service_role попал в клиентский бандл"
            exit 1
          fi
